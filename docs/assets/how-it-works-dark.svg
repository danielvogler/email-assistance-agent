<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-label="Where each part runs, and where sending stops. On your machine, your coding agent talks MCP to localhost, where a gcloud proxy signs each request with your Google identity. In your private Google Cloud project, the email assistance agent service on Cloud Run accepts only invokers you allow; it reads the app password from Secret Manager, which nobody else can read, and offers six tools: search, read_message, read_thread, list_drafts, create_draft and compose_draft. All its traffic leaves through a VPC firewall. IMAP on port 993 passes, so it can read your mailbox within the labels and age you allow and append drafts, replies in their thread or new emails, to the Drafts folder. SMTP on ports 465 and 587 is denied at the firewall, so it cannot send. In Google Workspace, you review the draft, edit it and send it yourself. Replies go back to the original senders, bodies are marked untrusted, nothing is deleted or marked read, and a person sends.">
  <title>How email assistance agent is deployed</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#A8A29A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1200" height="500" fill="#101215"/>

  <g font-family="Inter, Archivo, ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
    <!-- zones -->
    <rect x="30" y="40" width="250" height="380" rx="14" fill="#15181C" stroke="#2A2E34" stroke-width="1.5"/>
    <text x="50" y="68" font-size="11.5" font-weight="600" letter-spacing="1.8" fill="#6E6A63">YOUR MACHINE</text>

    <rect x="310" y="40" width="560" height="380" rx="14" fill="#15181C" stroke="#2A2E34" stroke-width="1.5"/>
    <text x="330" y="68" font-size="11.5" font-weight="600" letter-spacing="1.8" fill="#6E6A63">YOUR PRIVATE GOOGLE CLOUD PROJECT</text>

    <rect x="900" y="40" width="270" height="380" rx="14" fill="#15181C" stroke="#2A2E34" stroke-width="1.5"/>
    <text x="920" y="68" font-size="11.5" font-weight="600" letter-spacing="1.8" fill="#6E6A63">GOOGLE WORKSPACE</text>

    <!-- your machine -->
    <rect x="50" y="92" width="210" height="72" rx="10" fill="#181B1F" stroke="#343941" stroke-width="1.5"/>
    <text x="68" y="122" font-size="16" font-weight="600" fill="#FBFAF7">Coding agent</text>
    <text x="68" y="145" font-size="12.5" fill="#A8A29A">Claude Code, or any MCP client</text>

    <path d="M155 164 V238" stroke="#A8A29A" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="165" y="206" font-size="12" fill="#A8A29A">localhost:8080/mcp</text>

    <rect x="50" y="242" width="210" height="72" rx="10" fill="#181B1F" stroke="#343941" stroke-width="1.5"/>
    <text x="68" y="272" font-size="16" font-weight="600" fill="#FBFAF7">gcloud proxy</text>
    <text x="68" y="295" font-size="13" fill="#A8A29A">signs requests as you</text>

    <!-- into the project -->
    <path d="M260 278 H354" stroke="#A8A29A" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="268" y="268" font-size="12" fill="#A8A29A">HTTPS + IAM</text>

    <!-- secret manager -->
    <rect x="358" y="92" width="286" height="72" rx="10" fill="#181B1F" stroke="#343941" stroke-width="1.5"/>
    <text x="376" y="122" font-size="16" font-weight="600" fill="#FBFAF7">Secret Manager</text>
    <text x="376" y="145" font-size="13" fill="#A8A29A">app password, only the service reads it</text>
    <path d="M490 164 V206" stroke="#6E6A63" stroke-width="1.5" stroke-dasharray="4 5" stroke-linecap="round"/>

    <!-- the service -->
    <rect x="358" y="206" width="316" height="204" rx="12" fill="#181B1F" stroke="#FBFAF7" stroke-width="1.5"/>
    <text x="378" y="238" font-size="17" font-weight="600" fill="#FBFAF7">email assistance agent</text>
    <text x="378" y="260" font-size="13" fill="#A8A29A">on Cloud Run, private, invokers you allow</text>
    <g font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#FBFAF7">
      <rect x="378" y="278" width="72" height="26" rx="6" fill="#15181C"/><text x="414" y="295.5" text-anchor="middle">search</text>
      <rect x="458" y="278" width="110" height="26" rx="6" fill="#15181C"/><text x="513" y="295.5" text-anchor="middle">read_message</text>
      <rect x="378" y="312" width="104" height="26" rx="6" fill="#15181C"/><text x="430" y="329.5" text-anchor="middle">read_thread</text>
      <rect x="490" y="312" width="100" height="26" rx="6" fill="#15181C"/><text x="540" y="329.5" text-anchor="middle">list_drafts</text>
      <rect x="378" y="346" width="112" height="26" rx="6" fill="#181B1F" stroke="#FF6B5E" stroke-width="1.2"/><text x="434" y="363.5" text-anchor="middle">create_draft</text>
      <rect x="498" y="346" width="120" height="26" rx="6" fill="#181B1F" stroke="#FF6B5E" stroke-width="1.2"/><text x="558" y="363.5" text-anchor="middle">compose_draft</text>
    </g>
    <text x="378" y="398" font-size="12" fill="#6E6A63">no send, delete or move</text>

    <!-- the firewall -->
    <path d="M800 78 V404" stroke="#FBFAF7" stroke-width="2" stroke-dasharray="2 5" stroke-linecap="round"/>
    <text x="808" y="92" font-size="11.5" font-weight="600" letter-spacing="1.8" fill="#FBFAF7">VPC</text>
    <text x="808" y="107" font-size="11.5" font-weight="600" letter-spacing="1.8" fill="#FBFAF7">FIREWALL</text>

    <!-- read: IMAP -->
    <path d="M674 236 H760 Q770 236 770 226 V148 Q770 138 780 138 H916" fill="none" stroke="#A8A29A" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="690" y="228" font-size="12" fill="#A8A29A">IMAP 993</text>

    <!-- write: append draft -->
    <path d="M674 292 H916" fill="none" stroke="#A8A29A" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="690" y="284" font-size="12" fill="#A8A29A">append draft</text>

    <!-- send: blocked -->
    <path d="M674 360 H788" fill="none" stroke="#FF6B5E" stroke-width="1.5" stroke-dasharray="5 4"/>
    <circle cx="800" cy="360" r="12" fill="#101215" stroke="#FF6B5E" stroke-width="2"/>
    <path d="M794.5 354.5 L805.5 365.5 M805.5 354.5 L794.5 365.5" stroke="#FF6B5E" stroke-width="2.2" stroke-linecap="round"/>
    <text x="690" y="352" font-size="12" font-weight="600" fill="#FF6B5E">SMTP 465 / 587</text>
    <text x="820" y="382" font-size="12" font-weight="600" fill="#FF6B5E">denied</text>

    <!-- workspace -->
    <rect x="920" y="102" width="230" height="72" rx="10" fill="#181B1F" stroke="#343941" stroke-width="1.5"/>
    <text x="938" y="132" font-size="16" font-weight="600" fill="#FBFAF7">Mailbox</text>
    <text x="938" y="155" font-size="13" fill="#A8A29A">read-only, your labels and age</text>

    <rect x="920" y="256" width="230" height="72" rx="10" fill="#181B1F" stroke="#343941" stroke-width="1.5"/>
    <text x="938" y="286" font-size="16" font-weight="600" fill="#FBFAF7">Drafts</text>
    <text x="938" y="309" font-size="13" fill="#A8A29A">replies in their thread, new emails</text>

    <path d="M1035 328 V350" stroke="#A8A29A" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="920" y="352" width="230" height="48" rx="10" fill="#181B1F" stroke="#FF6B5E" stroke-width="1.5"/>
    <text x="938" y="382" font-size="15" font-weight="600" fill="#FBFAF7">You <tspan font-weight="400" fill="#A8A29A">review, edit and send</tspan></text>

    <path d="M60 446 H1140" stroke="#2A2E34" stroke-width="1.5"/>
    <text x="600" y="476" font-size="13.5" text-anchor="middle" fill="#6E6A63">Replies go back to the original senders · bodies are marked untrusted · nothing is deleted or marked read · <tspan fill="#FF6B5E" font-weight="600">a person sends</tspan></text>
  </g>
</svg>
